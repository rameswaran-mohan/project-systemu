[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "systemu"
# SINGLE-SOURCED — resolved from `systemu/__init__.py` at build time (see
# [tool.setuptools.dynamic] below).  A literal here drifted from
# `systemu.__version__` by 22 releases (0.9.59 vs 0.10.21), and because that
# dunder gates the vault migrator's `.seed_version` fast path, every seed-tool
# change in those releases silently stopped reaching operator vaults.  Bump
# `systemu/__init__.py` only; this metadata follows it.
dynamic = ["version"]
description = "Record computer activity and generate step-by-step instructions"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    # --- Capture engine (sharing_on) ---
    "mss>=9.0.0",
    "psutil>=5.9.0",
    "watchdog>=3.0.0",
    "Pillow>=10.0.0",
    "openai>=1.0.0",
    "python-dotenv>=1.0.0",
    "rich>=13.0.0",
    "click>=8.0.0",
    # v0.7-a-fix: pynput restricted to Windows.  It needs Xcode CLI tools
    # on macOS and X11 dev headers on Linux; on headless CI it fails to
    # install.  The sharing_on capture engine only uses pynput on Windows
    # anyway — the Mac + Linux capture paths use pyobjc / pyatspi.
    "pynput>=1.7.0; sys_platform == 'win32'",
    "uiautomation>=2.0.0; sys_platform == 'win32'",
    "pyobjc-core>=10.0; sys_platform == 'darwin'",
    "pyobjc-framework-ApplicationServices>=10.0; sys_platform == 'darwin'",
    # NOTE: pyatspi (Linux AT-SPI bindings) is intentionally NOT listed here.
    # It is distributed via system packages (`apt install python3-pyatspi`),
    # not PyPI — pip cannot resolve it, breaking install on Linux CI.  The
    # Linux introspector wraps the import in try/except, so the dep is
    # optional at runtime.  Linux users who want full UI introspection
    # should install the system package and grant their venv access to it
    # (or pip install python3-pyatspi-wrapper if a maintained wheel ever
    # appears on PyPI).
    #
    # v0.10.24 — `playwright` MOVED to [browser] and `nicegui` MOVED to
    # [dashboard].  They were the two largest wheels in the set (38.2 MB and
    # 20.3 MB of a 126.3 MB / 122-package install) and neither is reachable
    # from the CLI: every playwright import in the tree is inside a function
    # (runtime/web/browser_pool.py, runtime/web/provision.py) and nicegui is
    # only imported by systemu/interface/{pages,components}, which nothing
    # outside dashboard.py imports.  Their absence is now a first-class
    # UNAVAILABLE state carried by systemu/runtime/optional_deps.py to every
    # surface that lists a capability — see
    # tests/test_f21_optional_capability_honesty.py.  Do NOT move a further
    # package out of this list without registering a group there; a dep that
    # is neither core nor grouped has no honest unavailability path, and that
    # fence will refuse it.

    # --- v0.7-a-fix2: runtime stack ---
    # These were previously only in requirements.txt (a Windows-frozen
    # lockfile that CI no longer installs).  Vault + queue + scheduler need
    # them to import.  Listed at the loosest version that works.
    "sqlalchemy>=2.0",     # vault ORM
    "alembic>=1.13",       # vault migrations
    "huey>=2.5",           # task queue (SQLite + Redis broker)
    "apscheduler>=3.11",   # daemon's periodic jobs
    "pydantic>=2.0",       # vault Pydantic models
    "httpx>=0.27",         # used by the Ollama provider + general http
    "mcp>=1.0",            # v0.9.36 P2: official MCP client/server SDK (isolated under runtime/mcp/sdk)
    "pyyaml>=6.0",         # config + skill migrator + skill exporter
    "ddgs>=9.14",
    "keyring>=24",

    # --- W12-B1: the starter tool pack works from `pip install systemu` ---
    # Every pip dep the curated 41-tool seed pack declares ships with the
    # core install (ship-readiness R3/R5: no dep-approval interruptions on
    # first use; tests/test_starter_pack_conformance.py pins this).
    "requests>=2.31",      # fetch_json / fetch_html / download_file / api_call_get / web_extract
    "jsonschema>=4.0",     # extract_records / web_extract
    "openpyxl>=3.1",       # create/read_excel_sheet
    "python-docx>=1.1",    # create/read_word_doc
    "pyperclip>=1.8",      # clipboard_read / clipboard_write
    "plyer>=2.1",          # notify_desktop

    # --- W13.2a: packages forged tools most commonly request ---------------
    # Evidence: the field dep-approval store + forge history (geopy was the
    # first operator-approved package; data/scrape/date work dominates forge
    # asks). Bundling them removes the most frequent approval interruption;
    # anything NOT bundled still gets the one-click Inbox approve (W13.2b).
    "pandas>=2.0",         # tabular work — the most common forge ask
    "beautifulsoup4>=4.12",
    "lxml>=5.0",           # bs4's fast parser + xml tooling
    "geopy>=2.4",          # location lookups (get_current_location et al)
    "python-dateutil>=2.9",
]

[project.optional-dependencies]
# ── v0.10.24 OPTIONAL CAPABILITY GROUPS ──────────────────────────────────────
# Every extra below is REGISTERED in systemu/runtime/optional_deps.py::GROUPS.
# That registry is what turns "the package is absent" into an honest
# UNAVAILABLE across the capability index, `tools list`, `find-tools`, tool
# invocation and `doctor`, instead of a tool that looks ready and then dies.
#
# The two names must stay in lockstep: an extra with no group means an absent
# package with no remedy path; a group with no extra means the product prints
# a `pip install systemu[x]` line that pip accepts and silently no-ops.
# tests/test_f21_optional_capability_honesty.py fences BOTH directions.
browser   = ["playwright>=1.50.0"]   # web_read / web_act / web_screenshot
                                     # + `python -m playwright install chromium`
dashboard = ["nicegui>=2.0"]         # `systemu daemon start`, the web UI

# Everything optional, one line.  Two extras is two chances to run only the
# first, so operators who want the whole product get a single command.
all = [
    "playwright>=1.50.0",
    "nicegui>=2.0",
]

# Contributor install.  README has told people to run `pip install -e ".[dev]"`
# since v0.7 and there was no such extra — pip prints a warning and installs
# nothing, so the documented contributor setup silently produced a tree that
# could not run the dashboard tests.  It exists now, and it carries the
# optional groups because ~600 test modules reach systemu/interface/pages/*
# (nicegui at module scope) and tests/test_web_*.py reach playwright.
dev = [
    "playwright>=1.50.0",
    "nicegui>=2.0",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "fakeredis>=2.20",
]

# Three install modes — pick one with: pip install -e ".[<mode>]"
#   local            — native Python, SQLite vault + Huey-SQLite broker
#   docker-local     — docker-compose, Postgres vault + Huey-SQLite broker
#   docker-enterprise — docker-compose, Postgres vault + Huey-Redis broker

# Native LLM provider extras (v0.7-e):
#   anthropic        — native Anthropic SDK for claude-* models
#   openai-native    — native OpenAI SDK (already in core deps)
anthropic = ["anthropic>=0.40"]
openai-native = []  # uses existing openai dep

# v0.7-f: first out-of-tree plugin — Browser-Use wraps Playwright
# with an LLM-driven agent loop.
browser-use = ["browser-use>=0.5", "playwright>=1.40"]

# v0.7-g: Mem0 long-term memory backend (opt-in swap-in for the default
# filesystem JSONL+MD layout).  Select at runtime with
# SYSTEMU_MEMORY_BACKEND=mem0.
mem0 = ["mem0ai>=0.2"]

local = [
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "huey>=2.5",
    "apscheduler>=3.10",
]
docker-local = [
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "huey>=2.5",
    "apscheduler>=3.10",
    "psycopg2-binary>=2.9",
]
docker-enterprise = [
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "huey>=2.5",
    "apscheduler>=3.10",
    "psycopg2-binary>=2.9",
    "redis>=4.0",
]

# NOTE: Legacy extras `[sqlite]` and `[postgres]` were removed in this release.
# Use `[local]` (sqlite/alembic/huey) or `[docker-enterprise]` (+ postgres + redis)
# instead.  See README.md "Quick Start" for the install matrix.

[project.scripts]
# TWO NAMES, ONE ENTRY POINT — both are permanent, neither is deprecated.
#
# `systemu` is the name the docs lead with: it is the distribution the operator
# just typed into `pip install`, the Python package that holds the runtime, and
# the prefix on every SYSTEMU_* env var. Until v0.10.24 it was the ONE name the
# wheel did NOT install, so `pip install systemu` handed you a command called
# `sharing_on` that appears nowhere in the line you just ran — a discovery dead
# end that had already confused the AUTHORS (three runtime messages told
# operators to run `systemu doctor …`; F6 fixed the messages, this fixes the
# missing half).
#
# `sharing_on` is the original capture-engine name and stays exactly as it is.
# Existing installs, shell scripts, the Dockerfile, USER_GUIDE examples and
# every operator's muscle memory depend on it; an alias earns nothing by
# retiring the name it is aliasing.
#
# They MUST stay the same target — `tests/test_f6_command_names_are_invocable.py
# ::test_both_documented_program_names_are_declared` pins that, because two
# names pointing at two entry points is two programs with one manual.
sharing_on = "sharing_on.cli:main"
systemu = "sharing_on.cli:main"

[tool.pytest.ini_options]
markers = [
    "linux_only: tests that only run on Linux (playwright, posix-only paths)",
    "docker_required: tests that need a docker daemon",
    "e2e: end-to-end live tests (skipped by default)",
    "smoke: boot the real dashboard + exercise it on uvicorn's serving loop (opt-in pre-release gate)",
    "slow: long-running tests",
    "stub_survey: replaces the R-A9 situational-inventory survey with conftest's instant-empty double. OPT-IN (DEC-44): the real survey is the default, so every use needs a one-line justification comment. Replaces the old `real_survey` marker, which existed only because the stub used to be autouse",
    "real_keyring: exercises the REAL OS credential store (Windows Credential Manager / macOS Keychain / SecretService) instead of the fake keyring double — opt-in via SYSTEMU_RUN_REAL_KEYRING=1, off by default (machine-global state, not tmp_path-scoped)",
    "slow_gate_polls: opts out of the conftest quick-lane gate block-poll clamp - the test's SUBJECT is the real _poll_command_choice / _ask_operator_inline timeout, so it gets the untouched product functions and must bound itself (DEC-44)",
    "source_sensitive: reads a function/class SOURCE via inspect.getsource — fragile if the file under test is edited mid-run; auto-applied by conftest. Run `pytest -m 'not source_sensitive'` for the EDIT-SAFE gate (GATE-TIER / DEC-14).",
]

[tool.setuptools.dynamic]
# `systemu/__init__.py` is a docstring plus a string literal, so setuptools
# resolves this by STATIC AST read — it never imports the package, so the build
# does not need systemu's runtime dependencies present.  Keep that file literal
# (no computed version, no `importlib.metadata` lookup) or setuptools falls back
# to importing it at build time.
version = {attr = "systemu.__version__"}

[tool.setuptools]
# v0.8.10: ship non-Python data files (the vault seed + tool implementations)
# inside the wheel.  Combined with the package-data globs below, this makes a
# bare `pip install systemu` carry the curated tool pack + Wild Card shadow so
# the daemon boots with a working capability set out of the box.
include-package-data = true

[tool.setuptools.packages.find]
# Both top-level packages are part of the editable install:
#   * sharing_on  — the capture engine (declared as the PyPI package above)
#   * systemu     — the runtime, pipelines, interface, and starter vault
# The `silentgrasper*` rename-compat shim was removed in v0.3 per the
# deprecation window declared in v0.2's MIGRATION.md.
include = ["sharing_on*", "systemu*"]

[tool.setuptools.package-data]
# v0.7.3 Bug #6 fix — pip wheel must include LLM prompt templates and the
# starter skill/tool registry. Without these, every analyze / scroll-refine /
# skill-export call from a pip-installed copy fails with FileNotFoundError.
"sharing_on" = ["analyzer/prompts/*.md"]
# v0.8.10: also ship the vault seed (curated tool pack + Wild Card shadow) and
# the tool implementations from the top-level `systemu` package so a bare wheel
# install carries a working capability set.
"systemu" = [
    "prompts/*.md",
    "vault/**/*.json",
    "vault/tools/implementations/*.py",
    "vault/**/*.md",
    # W4.3: locally-vendored dashboard fonts (Inter + JetBrains Mono woff2)
    # served at /assets/fonts — must ship in the wheel or the pip-installed
    # dashboard falls back to system fonts.
    "interface/assets/fonts/*.woff2",
    "interface/assets/fonts/*.txt",
    # v0.9.37: brand logo (favicon + sidebar mark)
    "interface/assets/*.png",
]
"systemu.vault" = ["**/*.json", "**/*.md", "**/*.py"]
